<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracklog Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Widgets/widgets.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #000; }
    #viewer { position: absolute; inset: 0; }
    /* Pilot flags: a coloured tag with vertical name and altitude, its pointer
       touching the pilot's current position. Positioned each frame in JS. */
    #flags { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
    .pilot-flag {
      position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); will-change: transform;
    }
    .pilot-flag .flag-body {
      display: flex; align-items: center; /* flex runs along the text, i.e. vertically */
      background: var(--c); color: var(--ink); border-radius: 3px; padding: 6px 0;
      writing-mode: vertical-rl; transform: rotate(180deg); /* reads bottom to top */
      font: 600 12px/1.2 system-ui, sans-serif; white-space: nowrap;
    }
    .pilot-flag .flag-name, .pilot-flag .flag-alt { padding: 0 2px; }
    /* Hairline between name and altitude, stretched across the flag's full
       width (logical sizes, since the text runs vertically). */
    .pilot-flag .flag-sep {
      align-self: stretch; flex: none; inline-size: 1px; margin-inline: 6px;
      background: currentColor; opacity: .7;
    }
    .pilot-flag .flag-alt { font-weight: 400; }
    .pilot-flag::after {
      content: ''; border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 8px solid var(--c);
    }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(30, 30, 34, .88); color: #eee; padding: 12px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.4); font-size: 14px; width: min(330px, calc(100vw - 24px));
      box-sizing: border-box; max-height: calc(100% - 110px); overflow-y: auto;
    }
    #panel h1 { font-size: 16px; margin: 0 0 8px; }
    #panel.hidden { display: none; }
    .panel-head { display: flex; align-items: center; justify-content: flex-end; margin: -4px 0 8px; }
    #panel .panel-head button { padding: 2px 9px; font-size: 13px; }
    #panel-show {
      position: absolute; top: 12px; left: 12px; z-index: 10; display: none;
      background: rgba(30, 30, 34, .88); color: #eee; border: 1px solid #555; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.4); font: 14px system-ui, sans-serif; padding: 8px 12px; cursor: pointer;
    }
    #panel-show:hover { border-color: #888; }
    #panel.hidden + #panel-show { display: block; }
    #upload { display: none; }
    #add-files { margin-bottom: 8px; }
    #view-block {
      background: rgba(255, 255, 255, .07); border: 1px solid #555; border-radius: 6px;
      padding: 2px 10px; margin-bottom: 12px;
    }
    #view-block label { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 0; }
    #view-block label + label { border-top: 1px solid #444; }
    #view-block input { width: 18px; height: 18px; margin: 0; cursor: pointer; flex: none; }
    #view-block strong { display: block; }
    #view-block span { color: #aaa; font-size: 12px; }
    .empty { color: #aaa; font-size: 13px; padding: 4px 0; }
    #flights { list-style: none; margin: 0; padding: 0; }
    .flight { border-top: 1px solid #444; padding: 8px 0; }
    .flight-head { display: flex; align-items: center; gap: 8px; }
    .flight-head input[type=color] {
      width: 26px; height: 26px; padding: 0; border: none; background: none; cursor: pointer; flex: none;
    }
    /* Editable in place; looks like plain bold text until hovered or focused. */
    .flight-name {
      flex: 1; min-width: 0; font: inherit; font-weight: 600; color: inherit; background: transparent;
      border: none; border-bottom: 1px solid transparent; padding: 1px 0; margin: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text;
    }
    .flight-name:hover { border-bottom-color: #666; }
    .flight-name:focus { outline: none; border-bottom-color: #aaa; }
    .flight button { font-size: 12px; padding: 2px 6px; flex: none; }
    .flight button.active { background: #ffd23f; }
    /* Second row: glider on the left, camera buttons on the right. */
    .flight-sub { display: flex; align-items: center; gap: 6px; margin: 4px 0 0 34px; }
    .flight-meta {
      flex: 1; min-width: 0; color: #aaa; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #notice, #place-status { color: #ffcc66; margin-top: 6px; font-size: 13px; }
    #place-status:empty { display: none; }
    #error { color: #ff6b6b; margin-top: 6px; white-space: pre-line; }

    /* Shared control look for the panel and playbar. */
    #panel button, #playbar button, #playbar select {
      background: rgba(255, 255, 255, .07); color: #eee; border: 1px solid #555; border-radius: 6px;
      font: inherit; font-size: 13px; padding: 4px 10px; cursor: pointer;
    }
    #panel button:hover, #playbar button:hover, #playbar select:hover { border-color: #888; background: rgba(255, 255, 255, .12); }
    #panel .flight button { font-size: 12px; padding: 2px 8px; }
    #panel .flight button.active { background: #ffd23f; border-color: #ffd23f; color: #222; }
    #playbar select option { background: #2a2a2f; }
    #playbar button.toggle { white-space: nowrap; flex: none; }
    #playbar button.toggle.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }

    #playbar {
      position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 10;
      display: flex; align-items: center; gap: 12px;
      background: rgba(30, 30, 34, .88); color: #eee; padding: 8px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.4); font-size: 14px;
    }
    #playbar.disabled > * { opacity: .4; pointer-events: none; }
    #playbar button.icon { width: 34px; height: 30px; padding: 0; font-size: 14px; flex: none; }
    #pb-time { font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 11ch; }
    #pb-track { flex: 1; min-width: 80px; }
    #pb-slider { width: 100%; margin: 0; accent-color: #3b82f6; cursor: pointer; display: block; }
    #pb-coverage { position: relative; margin-top: 3px; }
    #pb-coverage div { position: absolute; height: 3px; border-radius: 2px; }
    #pb-span { color: #aaa; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* Followed-pilot chart: subtle white-on-translucent, aligned to the slider. */
    #flight-chart {
      position: absolute; z-index: 9; pointer-events: none;
      background: rgba(30, 30, 34, .25); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
      border-radius: 8px; color: rgba(255, 255, 255, .92); text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
      opacity: 0; transform: translateY(8px); visibility: hidden;
      transition: opacity .2s, transform .2s, visibility .2s;
    }
    #flight-chart.open { opacity: 1; transform: none; visibility: visible; }
    #flight-chart canvas { position: absolute; }
    #fc-readouts { position: absolute; display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; align-content: center; gap: 6px 14px; }
    #flight-chart.stacked #fc-readouts { gap: 4px 10px; }
    .fc-item { display: flex; flex-direction: column; line-height: 1.1; white-space: nowrap; }
    .fc-val { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .fc-cap { font-size: 11px; color: rgba(255, 255, 255, .65); }
    #flight-chart.stacked .fc-val, #flight-chart.short .fc-val { font-size: 14px; }
    #flight-chart.short #fc-readouts { gap: 2px 12px; }
    #flight-chart.short .fc-cap { font-size: 10px; }
    body.chart-open .cesium-viewer-bottom { transform: translateY(calc(-1 * var(--chart-h, 0px))); }

    /* Cesium's credits, restyled to match. */
    .cesium-viewer-bottom { left: 12px !important; right: auto !important; bottom: 62px !important; }
    .cesium-widget-credits { font-family: system-ui, sans-serif; font-size: 11px; color: #ddd; text-shadow: 0 1px 2px #000; }
    .cesium-widget-credits a { color: #ddd; }

    /* Phones in portrait: the playbar wraps to two rows (controls, then the
       slider), and the menu spans the width above it. */
    @media (max-width: 640px) {
      #panel { right: 12px; width: auto; max-height: calc(100% - 150px); }
      #playbar { flex-wrap: wrap; gap: 8px 10px; padding: 8px 10px; }
      #pb-time { margin-left: auto; min-width: 0; }
      #pb-track { order: 10; flex: 1 1 auto; }
      #pb-span { order: 11; }
      #pb-fullscreen { display: none; } /* not supported for pages on iPhone; the bar needs the room */
      .cesium-viewer-bottom { bottom: 104px !important; }
    }
    @media (max-width: 400px) {
      #playbar { gap: 8px 8px; }
      #playbar button.toggle, #playbar select { padding: 4px 7px; font-size: 12.5px; }
      #pb-time { font-size: 13px; }
    }

    /* Short screens (phones in landscape): compact everything so the 3D view
       keeps most of the screen. */
    @media (max-height: 500px) {
      #panel, #panel-show { top: 8px; left: 8px; }
      #panel { width: min(330px, calc(100vw - 16px)); padding: 8px 10px; font-size: 13px; max-height: calc(100% - 66px); }
      #panel .flight-head { gap: 6px; }
      #panel .flight button { padding: 2px 6px; }
      .panel-head { margin: -2px 0 6px; }
      #panel h1 { font-size: 14px; margin-bottom: 6px; }
      #view-block { margin-bottom: 8px; }
      #view-block label { padding: 3px 0; }
      #view-block span { display: none; }
      #view-block input { width: 16px; height: 16px; }
      .flight { padding: 5px 0; }
      .flight-sub { margin-top: 2px; }
      #playbar { left: 8px; right: 8px; bottom: 8px; padding: 5px 10px; gap: 10px; }
      #playbar button.icon { height: 28px; }
      #panel button, #playbar button, #playbar select { padding: 3px 8px; }
      .cesium-viewer-bottom { left: 8px !important; bottom: 50px !important; }
    }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="flags"></div>
  <div id="panel">
    <div class="panel-head">
      <button id="panel-hide" title="Hide menu">– Hide</button>
    </div>
    <div id="view-block">
      <label>
        <input type="checkbox" id="depth-of-field" checked>
        <div><strong>Depth of field</strong><span>'Model village' tilt-shift effect</span></div>
      </label>
      <label>
        <input type="checkbox" id="place-labels">
        <div><strong>Place labels</strong><span>Label towns and villages</span></div>
      </label>
      <label>
        <input type="checkbox" id="show-tracks" checked>
        <div><strong>Full tracks</strong><span>Show entire tracks</span></div>
      </label>
      <label>
        <input type="checkbox" id="show-trails" checked>
        <div><strong>Recent trails</strong><span>Highlight the last 5 minutes of tracks</span></div>
      </label>
    </div>
    <h1>Tracklogs</h1>
    <button id="add-files">Add tracklogs…</button>
    <input type="file" id="upload" accept=".igc,.IGC,.gpx,.GPX" multiple>
    <ul id="flights"></ul>
    <div id="notice"></div>
    <div id="place-status"></div>
    <div id="error"></div>
  </div>

  <button id="panel-show" title="Show menu">☰ Menu</button>

  <div id="flight-chart" aria-hidden="true">
    <div id="fc-readouts">
      <div class="fc-item"><span class="fc-val" id="fc-alt">–</span><span class="fc-cap">Altitude</span></div>
      <div class="fc-item"><span class="fc-val" id="fc-agl">–</span><span class="fc-cap">Above ground</span></div>
      <div class="fc-item"><span class="fc-val" id="fc-climb">–</span><span class="fc-cap">Climb</span></div>
      <div class="fc-item"><span class="fc-val" id="fc-speed">–</span><span class="fc-cap">Ground speed</span></div>
      <div class="fc-item"><span class="fc-val" id="fc-dist">–</span><span class="fc-cap">From start</span></div>
      <div class="fc-item"><span class="fc-val" id="fc-time">–</span><span class="fc-cap">Elapsed time</span></div>
    </div>
    <canvas id="fc-static"></canvas>
    <canvas id="fc-cursor"></canvas>
  </div>

  <div id="playbar" class="disabled">
    <button id="pb-play" class="icon" title="Play / pause (Space)">▶</button>
    <button id="auto-camera" class="toggle active" title="Pan and zoom to keep every pilot in view">Auto camera</button>
    <select id="pb-speed" title="Playback speed">
      <option value="1">1×</option>
      <option value="10">10×</option>
      <option value="30" selected>30×</option>
      <option value="60">60×</option>
      <option value="120">120×</option>
      <option value="300">300×</option>
    </select>
    <span id="pb-time">--:--:-- UTC</span>
    <div id="pb-track">
      <input type="range" id="pb-slider" min="0" max="1" step="1" value="0">
      <div id="pb-coverage"></div>
    </div>
    <span id="pb-span"></span>
    <button id="pb-fullscreen" class="icon" title="Fullscreen">⛶</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Cesium.js"></script>
  <script>
    const TRAIL_SECONDS = 300;
    const VARIO_WINDOW_SECONDS = 10;
    const TERRAIN_SAMPLE_LEVEL = 13; // used only if the terrain provider lacks availability info
    const TRACK_DECIMATION = 3;
    const AUTO_CAMERA_MIN_RADIUS = 1000; // metres; how close auto camera zooms on one pilot
    const AUTO_CAMERA_MARGIN = 1.4;
    const AUTO_CAMERA_SMOOTHING_SECONDS = 0.8;
    // Pitch blends from LOW (near-horizontal) at LOW_RADIUS to HIGH (near-vertical) at HIGH_RADIUS.
    const AUTO_CAMERA_LOW_PITCH_DEG = -12;
    const AUTO_CAMERA_HIGH_PITCH_DEG = -75;
    const AUTO_CAMERA_LOW_RADIUS = 1500; // metres
    const AUTO_CAMERA_HIGH_RADIUS = 30000; // metres
    const AUTO_CAMERA_GROUND_CLEARANCE = 150; // metres
    const AUTO_CAMERA_MIN_ZOOM = 0.05; // limits on the user's zoom, relative to the automatic range
    const AUTO_CAMERA_MAX_ZOOM = 20;
    // Follow: aim at a weighted average of the last FOLLOW_WINDOW_S of the
    // pilot's track (sampled every FOLLOW_SAMPLE_STEP_S), so circling holds
    // steady on the thermal.
    const FOLLOW_WINDOW_S = 60;
    const FOLLOW_SAMPLE_STEP_S = 2;
    const FOLLOW_MIN_RANGE = 2400; // metres; closest the follow camera gets
    // Depth of field (tilt-shift): sharp band half-height and blur falloff as
    // fractions of screen height, max blur tap spacing, and colour grade.
    const TILT_SHIFT_SHARP_HALF_HEIGHT = 0.06;
    const TILT_SHIFT_FALLOFF = 0.3;
    const TILT_SHIFT_MAX_STEP_PX = 3.0;
    const TILT_SHIFT_SATURATION = 1.4;
    const TILT_SHIFT_CONTRAST = 1.12;
    // Place labels: height above ground, and how far away each place type stays visible.
    const PLACE_LABEL_HEIGHT = 250; // metres
    const PLACE_MAX_DISTANCE = { city: 120000, town: 60000, village: 25000, hamlet: 10000 }; // metres
    const PLACE_BBOX_PADDING_DEG = 0.09; // ~10 km
    const PLACE_FONT = { city: '600 15px sans-serif', town: '600 14px sans-serif', village: '13px sans-serif', hamlet: '12px sans-serif' };
    const PLACE_FADE_START = 0.8; // fraction of max distance where labels start fading out
    const PLACE_LINE_MIN_OPACITY = 0.5; // the ground line only shows once the text is this readable
    const PLACE_BLUR_FADE = [0.15, 0.35]; // tilt-shift blur amount over which labels fade out
    const PLACE_UPDATE_MS = 100;
    const PLACE_RETRY_DELAYS_MS = [10000, 30000]; // page-side retries after the server's own retries fail
    // Followed-pilot chart.
    const CHART_TERRAIN_STEP_S = 10; // terrain profile sample spacing
    const CHART_TERRAIN_MAX_POINTS = 2000;
    // Ground-only tracks (walks, runs, rides) are clamped to the terrain; see isGroundOnly.
    const GROUND_SMOOTH_S = 60; // rolling-median window for height above ground, rejects GPS glitches
    const GROUND_AIRBORNE_AGL_M = 50; // smoothed height above ground beyond GPS and terrain-model error
    const GROUND_MIN_FLIGHT_S = 60; // ...held this long counts as flight if it also
    const GROUND_CLEAR_AGL_M = 150; // ...gets this high
    const GROUND_FLIGHT_SPEED_KMH = 15; // ...or moves this fast (median)
    const GROUND_LIFT_M = 1; // clamped tracks sit this far above the terrain so lines don't flicker into it
    const CHART_SLIDER_THUMB_INSET = 8; // px; the range thumb's centre travels this far inside the track
    const CHART_SPEED_WINDOW_S = 5;
    const CHART_READOUT_MS = 100;
    // Default colours, cycled as flights are added.
    const PALETTE = ['#ffd23f', '#ee4266', '#3bceac', '#540d6e', '#0ead69', '#f78c6b', '#118ab2', '#ffffff'];

    let viewer;
    let hasTerrain = false;
    let flights = [];
    let nextId = 0;
    let followedId = null;
    let showTracks = true;
    let showTrails = true;
    let showPlaces = false;
    let placeRetryTimer = null;
    let placeLoadGen = 0; // bumped to cancel in-flight loads and pending retries
    let places = []; // { name, font, base, top, maxDistance, opacity, label, line }
    // Place labels and lines live in plain primitive collections rather than
    // entities (showing/hiding an entity polyline rebuilds its whole geometry
    // batch, which stuttered playback). Only places currently visible are in
    // the collections, since hidden items still cost GPU time every frame.
    let placeLabels = null; // Cesium.LabelCollection
    let placeLines = null; // Cesium.PolylineCollection
    let placeLineMaterial = null;
    let lastPlaceUpdateMs = 0;
    const placeIds = new Set();

    async function createViewer() {
      const cfg = await (await fetch('/api/config')).json();
      const common = {
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        baseLayerPicker: false,
        animation: false,
        timeline: false,
        fullscreenButton: false,
        shouldAnimate: false,
      };
      // MapTiler is preferred: its free plan suits a public site better than ion's.
      if (cfg.maptiler_key) {
        const key = encodeURIComponent(cfg.maptiler_key);
        hasTerrain = true;
        // CesiumJS shows the "Cesium ion" logo by default; nothing here comes
        // from ion, so drop it (must be set before the viewer is created).
        Cesium.CreditDisplay.cesiumCredit = undefined;
        const viewer = new Cesium.Viewer('viewer', {
          ...common,
          terrainProvider: await Cesium.CesiumTerrainProvider.fromUrl(
            `https://api.maptiler.com/tiles/terrain-quantized-mesh-v2/?key=${key}`, { requestVertexNormals: true }),
          baseLayer: new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
            url: `https://api.maptiler.com/maps/satellite-v4/{z}/{x}/{y}.jpg?key=${key}`,
            minimumLevel: 0, maximumLevel: 20, tileWidth: 512, tileHeight: 512,
          })),
        });
        // Attribution required by MapTiler's terms (logo + data credits).
        viewer.creditDisplay.addStaticCredit(new Cesium.Credit(
          '<a href="https://www.maptiler.com/" target="_blank" rel="noopener">'
          + '<img src="https://api.maptiler.com/resources/logo.svg" alt="MapTiler" style="height:18px;vertical-align:middle"></a> '
          + '<a href="https://www.maptiler.com/copyright/" target="_blank" rel="noopener">&copy; MapTiler</a> '
          + '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">&copy; OpenStreetMap contributors</a>',
          true));
        // Fewer tile requests to stay within MapTiler's free quota (server-side
        // caching isn't allowed by its terms): accept 4 px of error before refining
        // (default 2, about one zoom level coarser) and keep more tiles in memory so
        // panning back or replaying doesn't refetch them.
        viewer.scene.globe.maximumScreenSpaceError = 4;
        viewer.scene.globe.tileCacheSize = 500;
        return viewer;
      }
      if (cfg.cesium_ion_token) {
        Cesium.Ion.defaultAccessToken = cfg.cesium_ion_token;
        hasTerrain = true;
        return new Cesium.Viewer('viewer', {
          ...common,
          terrainProvider: await Cesium.createWorldTerrainAsync(),
        });
      }
      document.getElementById('notice').textContent =
        'No CESIUM_ION_TOKEN set: showing flat map without terrain.';
      return new Cesium.Viewer('viewer', {
        ...common,
        baseLayer: new Cesium.ImageryLayer(
          new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' })),
        terrainProvider: new Cesium.EllipsoidTerrainProvider(),
      });
    }

    // Fill in terrain heights for the cartographics (in place) and return them.
    // sampleTerrainMostDetailed needs the provider to publish tile availability;
    // otherwise sample at a fixed level fine enough for paragliding.
    function sampleGround(cartos) {
      const provider = viewer.terrainProvider;
      return provider.availability
        ? Cesium.sampleTerrainMostDetailed(provider, cartos)
        : Cesium.sampleTerrain(provider, TERRAIN_SAMPLE_LEVEL, cartos);
    }

    // Tracklog (IGC/GPX) altitudes are usually above mean sea level, while
    // Cesium terrain is ellipsoidal. Pin the first fix (on launch) to the
    // terrain to align them.
    async function altitudeOffset(lon, lat, alt) {
      if (!hasTerrain) return 0;
      const [sample] = await sampleGround([Cesium.Cartographic.fromDegrees(lon, lat)]);
      return sample.height !== undefined ? sample.height - alt : 0;
    }

    async function addFlight(feature, fallbackName) {
      let coords = feature.geometry.coordinates;
      const p = feature.properties;
      const times = p.times;
      const name = p.pilot || fallbackName || 'Unknown pilot';
      const cssColor = PALETTE[flights.length % PALETTE.length];
      const color = Cesium.Color.fromCssColorString(cssColor);
      const offset = await altitudeOffset(...coords[0]);
      const terrainProfile = await sampleTerrainProfile(coords, times, offset);
      const onGround = terrainProfile ? isGroundOnly(terrainProfile, coords) : false;
      if (onGround) coords = await clampToGround(coords, offset);

      const start = Cesium.JulianDate.fromIso8601(p.start_time);
      const stop = Cesium.JulianDate.addSeconds(start, times[times.length - 1], new Cesium.JulianDate());
      const positions = coords.map(([lon, lat, alt]) => Cesium.Cartesian3.fromDegrees(lon, lat, alt + offset));

      const sampled = new Cesium.SampledPositionProperty();
      sampled.setInterpolationOptions({
        interpolationDegree: 1,
        interpolationAlgorithm: Cesium.LagrangePolynomialApproximation,
      });
      positions.forEach((pos, i) =>
        sampled.addSample(Cesium.JulianDate.addSeconds(start, times[i], new Cesium.JulianDate()), pos));

      const heightAt = (time) => {
        const pos = sampled.getValue(time);
        return pos ? Cesium.Cartographic.fromCartesian(pos).height - offset : undefined;
      };

      // Colour-bearing properties are kept so the colour can be changed later.
      const trackMaterial = new Cesium.ColorMaterialProperty(color.withAlpha(0.6));
      const trailMaterial = new Cesium.PolylineGlowMaterialProperty({ glowPower: 0.25, color });

      const track = viewer.entities.add({
        show: showTracks,
        polyline: {
          positions: positions.filter((_, i) => i % TRACK_DECIMATION === 0),
          width: 2,
          material: trackMaterial,
        },
      });
      const entities = [track];

      const pilot = viewer.entities.add({
        availability: new Cesium.TimeIntervalCollection([new Cesium.TimeInterval({ start, stop })]),
        position: sampled,
        path: { show: showTrails, leadTime: 0, trailTime: TRAIL_SECONDS, width: 6, resolution: 1, material: trailMaterial },
      });
      entities.push(pilot);

      // Current position is marked by an HTML flag (see updateFlags).
      const flag = document.createElement('div');
      flag.className = 'pilot-flag';
      setFlagColor(flag, cssColor);
      flag.innerHTML =
        '<div class="flag-body"><span class="flag-name"></span><span class="flag-sep"></span><span class="flag-alt"></span></div>';
      flag.querySelector('.flag-name').textContent = name;
      document.getElementById('flags').append(flag);

      const lons = coords.map(c => c[0]), lats = coords.map(c => c[1]);
      const bounds = {
        south: Math.min(...lats), north: Math.max(...lats), west: Math.min(...lons), east: Math.max(...lons),
      };

      const flight = {
        id: nextId++, name, props: p, cssColor, start, stop, positions, pilot, track, entities, bounds,
        flag, flagAlt: flag.querySelector('.flag-alt'), shownAlt: null,
        times, alts: coords.map(c => c[2]), coords, offset, sampled, altitudeAt: heightAt,
        terrainProfile, onGround,
        setColor(css) {
          const c = Cesium.Color.fromCssColorString(css);
          this.cssColor = css;
          trackMaterial.color = c.withAlpha(0.6);
          trailMaterial.color = c;
          setFlagColor(flag, css);
        },
        setName(name) {
          this.name = name;
          flag.querySelector('.flag-name').textContent = name;
          renderPlaybar(); // coverage strip tooltips
        },
      };
      flights.push(flight);
      updateClock();
      renderList();
      return flight;
    }

    function removeFlight(id) {
      const flight = flights.find(f => f.id === id);
      if (!flight) return;
      if (followedId === id) setFollowed(null);
      flight.entities.forEach(e => viewer.entities.remove(e));
      flight.flag.remove();
      flights = flights.filter(f => f.id !== id);
      if (!flights.length) clearPlaces();
      updateClock();
      renderList();
    }

    // Clock spans all loaded flights; flights play at their real (UTC) times.
    // The playhead keeps its place as flights are added or removed, unless it
    // falls outside the new span or this is the first flight loaded.
    let clockInUse = false;
    function updateClock() {
      if (!flights.length) {
        clockInUse = false;
        return;
      }
      const clock = viewer.clock;
      const start = flights.map(f => f.start).reduce((a, b) => Cesium.JulianDate.lessThan(a, b) ? a : b);
      const stop = flights.map(f => f.stop).reduce((a, b) => Cesium.JulianDate.greaterThan(a, b) ? a : b);
      const keepTime = clockInUse
        && Cesium.JulianDate.lessThanOrEquals(start, clock.currentTime)
        && Cesium.JulianDate.lessThanOrEquals(clock.currentTime, stop);
      clockInUse = true;
      clock.startTime = start.clone();
      clock.stopTime = stop.clone();
      if (!keepTime) clock.currentTime = start.clone();
      clock.clockRange = Cesium.ClockRange.CLAMPED;
    }

    // Fly to the flights: with auto camera, to the pilots' current positions
    // (pausing auto camera until the flight ends); otherwise to the whole tracks.
    function flyToAll() {
      let sphere, pitch;
      if (camCtl?.mode === 'auto') {
        const points = currentPilotPositions();
        if (!points.length) return;
        sphere = Cesium.BoundingSphere.fromPoints(points);
        sphere.radius = Math.max(sphere.radius, AUTO_CAMERA_MIN_RADIUS);
        pitch = autoCameraPitch(sphere.radius);
        camCtl.paused = true;
        camCtl.center = null;
      } else {
        const points = flights.flatMap(f => f.positions.filter((_, i) => i % 20 === 0));
        if (!points.length) return;
        sphere = Cesium.BoundingSphere.fromPoints(points);
        pitch = Cesium.Math.toRadians(-35);
      }
      const resume = () => {
        if (!camCtl) return;
        camCtl.paused = false;
        camCtl.lastMs = performance.now();
      };
      viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY); // release any auto-camera lookAt
      viewer.camera.flyToBoundingSphere(sphere, {
        offset: new Cesium.HeadingPitchRange(0, pitch, 0), duration: 2, complete: resume, cancel: resume,
      });
    }

    // Flag text is the pilot's own hue, pushed very dark or very light,
    // whichever contrasts more with the flag, so it stands out on any colour.
    function setFlagColor(flag, css) {
      const c = Cesium.Color.fromCssColorString(css);
      const lum = (col) => {
        const lin = (v) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
        return 0.2126 * lin(col.red) + 0.7152 * lin(col.green) + 0.0722 * lin(col.blue);
      };
      const contrast = (a, b) => (Math.max(lum(a), lum(b)) + 0.05) / (Math.min(lum(a), lum(b)) + 0.05);
      const dark = Cesium.Color.lerp(c, Cesium.Color.BLACK, 0.85, new Cesium.Color());
      const light = Cesium.Color.lerp(c, Cesium.Color.WHITE, 0.85, new Cesium.Color());
      const ink = contrast(c, dark) >= contrast(c, light) ? dark : light;
      flag.style.setProperty('--c', css);
      flag.style.setProperty('--ink', ink.toCssColorString());
    }

    // Place each pilot's flag so its pointer touches the pilot on screen; hide
    // it outside the flight's time span or when the pilot is over the horizon.
    function updateFlags() {
      const time = viewer.clock.currentTime;
      const occluder = new Cesium.EllipsoidalOccluder(Cesium.Ellipsoid.WGS84, viewer.camera.positionWC);
      for (const f of flights) {
        const pos = f.pilot.isAvailable(time) ? f.sampled.getValue(time) : undefined;
        const win = pos && occluder.isPointVisible(pos)
          ? Cesium.SceneTransforms.worldToWindowCoordinates(viewer.scene, pos) : undefined;
        if (!win) {
          f.flag.style.display = 'none';
          continue;
        }
        f.flag.style.display = '';
        f.flag.style.transform = `translate(${Math.round(win.x)}px, ${Math.round(win.y)}px) translate(-50%, -100%)`;
        const alt = Math.round(f.altitudeAt(time));
        if (alt !== f.shownAlt) {
          f.shownAlt = alt;
          f.flagAlt.textContent = `${alt} m`;
        }
      }
    }

    function currentPilotPositions() {
      return flights.map(f => f.pilot.position.getValue(viewer.clock.currentTime)).filter(Boolean);
    }

    function setFollowed(id) {
      followedId = id;
      const flight = flights.find(f => f.id === id);
      if (flight) startCamCtl('follow');
      else if (camCtl?.mode === 'follow') stopCamCtl();
      if (flight) openChart(flight);
      else closeChart();
      renderList();
    }

    // Camera controller shared by Auto camera and Follow. Each frame it frames
    // a set of target points, easing towards them so the view pans and zooms
    // smoothly. The view stays low and oblique when the points are close
    // together and tilts towards top-down as it pulls out to fit a wider
    // spread. The user can still swing the heading round, and zooming scales
    // the automatic range by a factor that sticks until the user zooms again
    // or clicks Auto camera / Follow again. Pitch is automatic.
    //   auto:   every pilot's current position.
    //   follow: the followed pilot's track over the last FOLLOW_WINDOW_S of
    //           flight time, so while circling the camera holds on the
    //           thermal's centre instead of orbiting with the glider.
    let camCtl = null; // { mode, center, range, pitch, zoom, lastMs, paused } while active

    function startCamCtl(mode) {
      // Carry the eased state over when switching modes so the view glides across.
      const prev = camCtl;
      camCtl = {
        mode, center: prev?.center?.clone() ?? null, range: prev?.range ?? null, pitch: prev?.pitch ?? null,
        zoom: 1, // the user's zoom, as a multiple of the automatic range; reset by the buttons
        lastMs: performance.now(), paused: false,
      };
      document.getElementById('auto-camera').classList.toggle('active', mode === 'auto');
    }

    function stopCamCtl() {
      camCtl = null;
      document.getElementById('auto-camera').classList.remove('active');
      viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    }

    // What the controller frames: { center, radius }, or null if nothing to frame.
    function cameraTarget() {
      if (camCtl.mode === 'auto') {
        const points = currentPilotPositions();
        return points.length ? Cesium.BoundingSphere.fromPoints(points) : null;
      }
      const flight = flights.find(f => f.id === followedId);
      if (!flight) return null;
      const now = viewer.clock.currentTime;
      const current = flight.sampled.getValue(now);
      if (!current) return null;
      // Weighted average of the recent track. A Hann window (weights tapering to
      // zero at both ends) stops the centre lurching as part-circles enter and
      // leave the window; a plain bounding-sphere centre jumps whenever a
      // different point becomes the outermost one.
      const n = Math.round(FOLLOW_WINDOW_S / FOLLOW_SAMPLE_STEP_S);
      const center = new Cesium.Cartesian3();
      const scratch = new Cesium.Cartesian3();
      const points = [];
      let total = 0;
      for (let k = 0; k <= n; k++) {
        const pos = flight.sampled.getValue(
          Cesium.JulianDate.addSeconds(now, -k * FOLLOW_SAMPLE_STEP_S, new Cesium.JulianDate()));
        if (!pos) break; // before take-off
        const w = 0.5 - 0.5 * Math.cos((2 * Math.PI * (k + 0.5)) / (n + 1));
        Cesium.Cartesian3.add(center, Cesium.Cartesian3.multiplyByScalar(pos, w, scratch), center);
        total += w;
        points.push(pos);
      }
      Cesium.Cartesian3.divideByScalar(center, total, center);
      // Frame the glider and its recent track around that centre.
      const radius = Math.max(...points.map(pt => Cesium.Cartesian3.distance(pt, center)));
      return new Cesium.BoundingSphere(center, radius);
    }

    // Where the camera is currently looking (centre of the screen on the globe).
    function cameraLookPoint() {
      const canvas = viewer.scene.canvas;
      const ray = viewer.camera.getPickRay(new Cesium.Cartesian2(canvas.clientWidth / 2, canvas.clientHeight / 2));
      return ray ? viewer.scene.globe.pick(ray, viewer.scene) : undefined;
    }

    // Pitch for a given framing radius: shallow up close, steep when far out.
    function autoCameraPitch(radius) {
      const t = Cesium.Math.clamp(
        Math.log(radius / AUTO_CAMERA_LOW_RADIUS) / Math.log(AUTO_CAMERA_HIGH_RADIUS / AUTO_CAMERA_LOW_RADIUS), 0, 1);
      const eased = t * t * (3 - 2 * t); // smoothstep
      return Cesium.Math.toRadians(
        AUTO_CAMERA_LOW_PITCH_DEG + (AUTO_CAMERA_HIGH_PITCH_DEG - AUTO_CAMERA_LOW_PITCH_DEG) * eased);
    }

    // Steepen the pitch if needed to keep the camera clear of the terrain
    // beneath it (sampled at last frame's camera position, close enough).
    function terrainSafePitch(center, pitch, range) {
      const centerHeight = Cesium.Cartographic.fromCartesian(center).height;
      const ground = viewer.scene.globe.getHeight(viewer.camera.positionCartographic) ?? 0;
      const needed = (ground + AUTO_CAMERA_GROUND_CLEARANCE - centerHeight) / range; // sin(-pitch) required
      if (needed <= Math.sin(-pitch)) return pitch;
      return -Math.asin(Cesium.Math.clamp(needed, 0, 1));
    }

    // One-off fly-out to frame a single pilot's whole track. Auto camera and
    // follow would immediately pull the view away again, so both are switched off.
    function showEntireTrack(flight) {
      setFollowed(null);
      setAutoCamera(false);
      const points = flight.positions.filter((_, i) => i % 20 === 0);
      viewer.camera.flyToBoundingSphere(Cesium.BoundingSphere.fromPoints(points), {
        offset: new Cesium.HeadingPitchRange(viewer.camera.heading, Cesium.Math.toRadians(-45), 0),
        duration: 2,
      });
    }

    function setAutoCamera(on) {
      if (on) {
        if (camCtl?.mode === 'auto') return;
        startCamCtl('auto'); // takes over from follow, keeping its eased state
        if (followedId !== null) setFollowed(null);
      } else if (camCtl?.mode === 'auto') {
        stopCamCtl();
      }
    }

    function updateAutoCamera() {
      if (!camCtl || camCtl.paused) return;
      const sphere = cameraTarget();
      if (!sphere) return;

      const follow = camCtl.mode === 'follow';
      const radius = follow ? sphere.radius : Math.max(sphere.radius, AUTO_CAMERA_MIN_RADIUS);
      const fov = Math.min(viewer.camera.frustum.fov, viewer.camera.frustum.fovy ?? viewer.camera.frustum.fov);
      let targetRange = AUTO_CAMERA_MARGIN * radius / Math.sin(fov / 2);
      if (follow) targetRange = Math.max(targetRange, FOLLOW_MIN_RANGE);
      targetRange *= camCtl.zoom;

      const now = performance.now();
      const dt = Math.max(0, now - camCtl.lastMs) / 1000; // never negative, or the easing would overshoot
      const alpha = 1 - Math.exp(-dt / AUTO_CAMERA_SMOOTHING_SECONDS);
      camCtl.lastMs = now;
      if (!camCtl.center) {
        // Start from wherever the camera is looking now, so taking control eases in.
        const look = cameraLookPoint() ?? sphere.center;
        camCtl.center = look.clone();
        camCtl.range = Cesium.Cartesian3.distance(viewer.camera.positionWC, look);
        camCtl.pitch = viewer.camera.pitch;
      } else {
        // The camera is still in last frame's lookAt frame, so its distance from
        // the origin is the range. If that no longer matches what was set, the
        // user zoomed (wheel, pinch or its inertia): keep the new range and fold
        // the change into the zoom factor so it persists.
        const actual = Cesium.Cartesian3.magnitude(viewer.camera.position);
        if (Math.abs(actual - camCtl.range) > 1e-4 * camCtl.range) {
          const zoom = Cesium.Math.clamp(camCtl.zoom * actual / camCtl.range, AUTO_CAMERA_MIN_ZOOM, AUTO_CAMERA_MAX_ZOOM);
          targetRange *= zoom / camCtl.zoom;
          camCtl.zoom = zoom;
          camCtl.range = actual;
        }
        Cesium.Cartesian3.lerp(camCtl.center, sphere.center, alpha, camCtl.center);
        camCtl.range += (targetRange - camCtl.range) * alpha;
        // Zooming in also lowers the view, zooming out steepens it, as for auto framing.
        const targetPitch = autoCameraPitch(radius * camCtl.zoom);
        camCtl.pitch += (targetPitch - camCtl.pitch) * alpha;
      }

      const heading = viewer.camera.heading;
      const pitch = terrainSafePitch(camCtl.center, camCtl.pitch, camCtl.range);
      viewer.camera.lookAt(camCtl.center, new Cesium.HeadingPitchRange(heading, pitch, camCtl.range));
    }

    function renderList() {
      renderPlaybar();
      const list = document.getElementById('flights');
      if (!flights.length) {
        list.innerHTML = '<li class="empty">No tracklogs loaded yet. Add one or more IGC or GPX files.</li>';
        return;
      }
      list.replaceChildren(...flights.map(f => {
        const li = document.createElement('li');
        li.className = 'flight';
        const p = f.props;
        li.innerHTML = `
          <div class="flight-head">
            <input type="color" title="Track colour">
            <input class="flight-name" type="text" spellcheck="false" maxlength="60" title="Click to rename">
            <button class="remove" title="Remove flight">✕</button>
          </div>
          <div class="flight-sub">
            <span class="flight-meta"></span>
            <button class="follow" title="Camera follows this pilot">Follow</button>
            <button class="entire" title="Zoom out to show this pilot's whole track">Entire track</button>
          </div>`;
        const nameInput = li.querySelector('.flight-name');
        nameInput.value = f.name;
        nameInput.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') nameInput.blur();
          if (ev.key === 'Escape') { nameInput.value = f.name; nameInput.blur(); }
        });
        nameInput.addEventListener('change', () => {
          const name = nameInput.value.trim();
          if (name) f.setName(name);
          nameInput.value = f.name; // shows the trimmed name, or reverts an empty one
        });
        li.querySelector('.flight-meta').textContent = p.glider ?? '';
        const picker = li.querySelector('input[type=color]');
        picker.value = f.cssColor;
        picker.addEventListener('input', () => { f.setColor(picker.value); renderPlaybar(); });
        const follow = li.querySelector('.follow');
        follow.classList.toggle('active', followedId === f.id);
        follow.addEventListener('click', () => setFollowed(followedId === f.id ? null : f.id));
        li.querySelector('.entire').addEventListener('click', () => showEntireTrack(f));
        li.querySelector('.remove').addEventListener('click', () => removeFlight(f.id));
        return li;
      }));
    }

    // Depth of field: a tilt-shift 'miniature' effect. A horizontal band through
    // the pilots stays sharp, the image blurs progressively above and below it
    // (separable Gaussian, two passes), and colours are boosted to look toy-like.
    let tiltShift = null; // { stage, focusY }

    const TILT_SHIFT_BLUR_GLSL = (horizontal) => `
      uniform sampler2D colorTexture;
      uniform float focusY;      // 0 = bottom, 1 = top of screen
      in vec2 v_textureCoordinates;
      void main() {
        float d = abs(v_textureCoordinates.y - focusY);
        float amount = smoothstep(${TILT_SHIFT_SHARP_HALF_HEIGHT.toFixed(3)},
                                  ${(TILT_SHIFT_SHARP_HALF_HEIGHT + TILT_SHIFT_FALLOFF).toFixed(3)}, d);
        vec2 dir = ${horizontal ? 'vec2(1.0, 0.0)' : 'vec2(0.0, 1.0)'} / czm_viewport.zw;
        vec2 tapOffset = dir * amount * ${TILT_SHIFT_MAX_STEP_PX.toFixed(1)};
        float weights[5] = float[](0.227, 0.195, 0.122, 0.054, 0.016);
        vec4 sum = texture(colorTexture, v_textureCoordinates) * weights[0];
        for (int i = 1; i < 5; i++) {
          sum += texture(colorTexture, v_textureCoordinates + tapOffset * float(i)) * weights[i];
          sum += texture(colorTexture, v_textureCoordinates - tapOffset * float(i)) * weights[i];
        }
        out_FragColor = sum;
      }`;

    const TILT_SHIFT_GRADE_GLSL = `
      uniform sampler2D colorTexture;
      in vec2 v_textureCoordinates;
      void main() {
        vec4 c = texture(colorTexture, v_textureCoordinates);
        float grey = dot(c.rgb, vec3(0.299, 0.587, 0.114));
        vec3 rgb = mix(vec3(grey), c.rgb, ${TILT_SHIFT_SATURATION.toFixed(2)});
        rgb = (rgb - 0.5) * ${TILT_SHIFT_CONTRAST.toFixed(2)} + 0.5;
        out_FragColor = vec4(clamp(rgb, 0.0, 1.0), c.a);
      }`;

    function createTiltShift() {
      const state = { focusY: 0.5 };
      const uniforms = { focusY: () => state.focusY };
      state.stage = viewer.scene.postProcessStages.add(new Cesium.PostProcessStageComposite({
        stages: [
          new Cesium.PostProcessStage({ fragmentShader: TILT_SHIFT_BLUR_GLSL(true), uniforms }),
          new Cesium.PostProcessStage({ fragmentShader: TILT_SHIFT_BLUR_GLSL(false), uniforms }),
          new Cesium.PostProcessStage({ fragmentShader: TILT_SHIFT_GRADE_GLSL }),
        ],
      }));
      state.stage.enabled = document.getElementById('depth-of-field').checked;
      return state;
    }

    // Keep the sharp band on the pilots (their screen-space centre), eased.
    function updateTiltShift() {
      if (!tiltShift || !tiltShift.stage.enabled) return;
      let target = 0.5;
      // Focus on the followed pilot if there is one, otherwise on everyone.
      const followed = flights.find(f => f.id === followedId);
      const points = followed
        ? [followed.pilot.position.getValue(viewer.clock.currentTime)].filter(Boolean)
        : currentPilotPositions();
      if (points.length) {
        const centre = Cesium.BoundingSphere.fromPoints(points).center;
        const px = viewer.scene.cartesianToCanvasCoordinates(centre);
        if (px) target = Cesium.Math.clamp(1 - px.y / viewer.canvas.clientHeight, 0.15, 0.85);
      }
      tiltShift.focusY += (target - tiltShift.focusY) * 0.1;
    }

    // Place labels from OpenStreetMap (via /api/places): white names raised
    // above the ground on a thin line, fading out with distance, with smaller
    // places only shown closer in so the view stays uncluttered.
    // Load place names for the loaded flights, but only while labels are on.
    function requestPlaces() {
      if (!showPlaces || !flights.length) return;
      clearTimeout(placeRetryTimer);
      loadPlaces(++placeLoadGen, 0);
    }

    function cancelPlaceLoading() {
      clearTimeout(placeRetryTimer);
      placeLoadGen++;
      document.getElementById('place-status').textContent = '';
    }

    async function loadPlaces(gen, attempt) {
      if (!flights.length) return;
      const status = document.getElementById('place-status');
      const b = {
        south: Math.min(...flights.map(f => f.bounds.south)), north: Math.max(...flights.map(f => f.bounds.north)),
        west: Math.min(...flights.map(f => f.bounds.west)), east: Math.max(...flights.map(f => f.bounds.east)),
      };
      const lonPad = PLACE_BBOX_PADDING_DEG / Math.cos(Cesium.Math.toRadians((b.south + b.north) / 2));
      const query = new URLSearchParams({
        south: (b.south - PLACE_BBOX_PADDING_DEG).toFixed(4), north: (b.north + PLACE_BBOX_PADDING_DEG).toFixed(4),
        west: (b.west - lonPad).toFixed(4), east: (b.east + lonPad).toFixed(4),
      });
      let found;
      try {
        const res = await fetch(`/api/places?${query}`);
        const body = await res.json();
        if (!res.ok) throw new Error(body.detail ?? res.statusText);
        found = body.places;
      } catch (e) {
        if (gen !== placeLoadGen) return; // cancelled or superseded
        if (attempt < PLACE_RETRY_DELAYS_MS.length) {
          status.textContent = 'Place labels: retrying…';
          placeRetryTimer = setTimeout(() => loadPlaces(gen, attempt + 1), PLACE_RETRY_DELAYS_MS[attempt]);
        } else {
          status.textContent = `Place labels unavailable: ${e.message}`;
        }
        return;
      }
      if (gen !== placeLoadGen) return;
      status.textContent = '';

      const fresh = found.filter(pl => !placeIds.has(pl.id));
      if (!fresh.length) return;
      const cartos = fresh.map(pl => Cesium.Cartographic.fromDegrees(pl.lon, pl.lat));
      if (hasTerrain) await sampleGround(cartos);
      if (gen !== placeLoadGen) return;
      fresh.forEach(pl => placeIds.add(pl.id));

      fresh.forEach((pl, i) => {
        const ground = cartos[i].height ?? 0;
        const base = Cesium.Cartesian3.fromDegrees(pl.lon, pl.lat, ground);
        const top = Cesium.Cartesian3.fromDegrees(pl.lon, pl.lat, ground + PLACE_LABEL_HEIGHT);
        // Labels and lines are created on demand by applyPlaceOpacity().
        places.push({
          name: pl.name, font: PLACE_FONT[pl.type] ?? PLACE_FONT.hamlet, base, top,
          maxDistance: PLACE_MAX_DISTANCE[pl.type] ?? PLACE_MAX_DISTANCE.hamlet,
          opacity: 0, label: null, line: null,
        });
      });
      lastPlaceUpdateMs = 0; // show the new places straight away
    }

    const smoothstep = (a, b, x) => {
      const t = Cesium.Math.clamp((x - a) / (b - a), 0, 1);
      return t * t * (3 - 2 * t);
    };

    // Per-place opacity = distance fade x tilt-shift blur fade (0 if off-screen).
    // The text alpha follows the opacity, and the ground line only appears when
    // the text is readable, so there are never bare stalks.
    function updatePlaceVisibility() {
      if (!showPlaces || !places.length) return;
      const now = performance.now();
      if (now - lastPlaceUpdateMs < PLACE_UPDATE_MS) return;
      lastPlaceUpdateMs = now;

      const camPos = viewer.camera.positionWC;
      const height = viewer.canvas.clientHeight;
      const width = viewer.canvas.clientWidth;
      const blurOn = tiltShift && tiltShift.stage.enabled;
      const screen = new Cesium.Cartesian2();
      for (const pl of places) {
        const distance = Cesium.Cartesian3.distance(camPos, pl.top);
        let o = 1 - smoothstep(pl.maxDistance * PLACE_FADE_START, pl.maxDistance, distance);
        if (o > 0) {
          const px = viewer.scene.cartesianToCanvasCoordinates(pl.top, screen);
          if (!px || px.x < 0 || px.x > width || px.y < 0 || px.y > height) {
            o = 0;
          } else if (blurOn) {
            const y = 1 - px.y / height; // same convention as the shader's focusY
            const blur = smoothstep(TILT_SHIFT_SHARP_HALF_HEIGHT, TILT_SHIFT_SHARP_HALF_HEIGHT + TILT_SHIFT_FALLOFF,
              Math.abs(y - tiltShift.focusY));
            o *= 1 - smoothstep(PLACE_BLUR_FADE[0], PLACE_BLUR_FADE[1], blur);
          }
        }
        applyPlaceOpacity(pl, o);
      }
    }

    function applyPlaceOpacity(pl, o) {
      if (o < 0.02) o = 0;
      const changed = Math.abs(o - pl.opacity) > 0.05 || (o === 0) !== (pl.opacity === 0);
      if (changed) {
        pl.opacity = o;
        if (o === 0) {
          if (pl.label) placeLabels.remove(pl.label);
          pl.label = null;
        } else if (!pl.label) {
          pl.label = placeLabels.add({
            position: pl.top,
            text: pl.name,
            font: pl.font,
            fillColor: Cesium.Color.WHITE.withAlpha(o),
            outlineColor: Cesium.Color.BLACK.withAlpha(0.75 * o),
            outlineWidth: 3,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -3),
          });
        } else {
          pl.label.fillColor = Cesium.Color.WHITE.withAlpha(o);
          pl.label.outlineColor = Cesium.Color.BLACK.withAlpha(0.75 * o);
        }
      }
      const lineShown = o >= PLACE_LINE_MIN_OPACITY;
      if (lineShown && !pl.line) {
        pl.line = placeLines.add({ positions: [pl.base, pl.top], width: 1, material: placeLineMaterial });
      } else if (!lineShown && pl.line) {
        placeLines.remove(pl.line);
        pl.line = null;
      }
    }

    function clearPlaces() {
      cancelPlaceLoading();
      placeLabels.removeAll();
      placeLines.removeAll();
      places = [];
      placeIds.clear();
    }

    // Followed-pilot chart: altitude and terrain over the whole clock span,
    // aligned to the time slider, with a cursor at the current time and live
    // readouts (altitude, height above ground, climb, ground speed, straight-line
    // distance from takeoff, flight time) to its left.
    const chart = {
      el: document.getElementById('flight-chart'),
      readouts: document.getElementById('fc-readouts'),
      staticCanvas: document.getElementById('fc-static'),
      cursorCanvas: document.getElementById('fc-cursor'),
      flight: null,
      plot: null, // { w, h } in CSS px
      scales: null, // from chartScales(), cached at each static redraw
      lastCursorX: null,
      lastReadoutMs: 0,
    };

    function openChart(flight) {
      chart.flight = flight;
      chart.el.classList.add('open');
      document.body.classList.add('chart-open');
      layoutChart();
      drawChartStatic();
      updateChart(true);
    }

    function closeChart() {
      chart.flight = null;
      chart.el.classList.remove('open');
      document.body.classList.remove('chart-open');
    }

    // Ground height under the track (same datum as the track altitude), sampled
    // every CHART_TERRAIN_STEP_S when the track is loaded. Used to tell flights
    // from ground activities and for the chart. Null without terrain.
    async function sampleTerrainProfile(coords, times, offset) {
      if (!hasTerrain) return null;
      const idx = [];
      let lastT = -Infinity;
      for (let i = 0; i < times.length; i++) {
        if (times[i] - lastT >= CHART_TERRAIN_STEP_S) { idx.push(i); lastT = times[i]; }
      }
      const stride = Math.ceil(idx.length / CHART_TERRAIN_MAX_POINTS);
      const picked = idx.filter((_, k) => k % stride === 0);
      const cartos = picked.map(i => Cesium.Cartographic.fromDegrees(coords[i][0], coords[i][1]));
      try {
        await sampleGround(cartos);
      } catch {
        return null;
      }
      return { idx: picked, t: picked.map(i => times[i]), ground: cartos.map(c => (c.height ?? 0) - offset) };
    }

    // True if the track never really leaves the ground. Height above ground is
    // smoothed with a rolling median (so one-off GPS spikes vanish), then any
    // stretch more than GROUND_AIRBORNE_AGL_M up for GROUND_MIN_FLIGHT_S counts
    // as flight if it also climbs past GROUND_CLEAR_AGL_M or moves at flying
    // speed. Those last two reject walkers along ridges where the terrain model
    // is too low: they are slow and the error is rarely that large. A long hike
    // with one short flight is still a flight.
    function isGroundOnly(profile, coords) {
      const { idx, t, ground } = profile;
      const n = t.length;
      if (n < 2) return false;
      const agl = idx.map((i, k) => coords[i][2] - ground[k]);
      const median = (xs) => {
        const v = [...xs].sort((a, b) => a - b), m = v.length >> 1;
        return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
      };
      const smooth = [];
      for (let k = 0, lo = 0, hi = 0; k < n; k++) {
        while (t[lo] < t[k] - GROUND_SMOOTH_S / 2) lo++;
        while (hi + 1 < n && t[hi + 1] <= t[k] + GROUND_SMOOTH_S / 2) hi++;
        smooth.push(median(agl.slice(lo, hi + 1)));
      }
      for (let a = 0; a < n; a++) {
        if (smooth[a] <= GROUND_AIRBORNE_AGL_M) continue;
        let b = a;
        while (b + 1 < n && smooth[b + 1] > GROUND_AIRBORNE_AGL_M) b++;
        if (t[b] - t[a] >= GROUND_MIN_FLIGHT_S) {
          const peak = Math.max(...smooth.slice(a, b + 1));
          const speeds = [];
          for (let k = a; k < b; k++) {
            speeds.push(groundDistanceM(coords[idx[k]], coords[idx[k + 1]]) / (t[k + 1] - t[k]) * 3.6);
          }
          if (peak >= GROUND_CLEAR_AGL_M || median(speeds) >= GROUND_FLIGHT_SPEED_KMH) return false;
        }
        a = b;
      }
      return true;
    }

    // Great-circle distance in metres between two [lon, lat, ...] points.
    function groundDistanceM([lon1, lat1], [lon2, lat2]) {
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
      return 2 * 6371008.8 * Math.asin(Math.sqrt(h));
    }

    // Replace every altitude with the terrain height beneath it (in the track's
    // datum), just above the surface.
    async function clampToGround(coords, offset) {
      const cartos = coords.map(([lon, lat]) => Cesium.Cartographic.fromDegrees(lon, lat));
      await sampleGround(cartos);
      return coords.map(([lon, lat, alt], i) =>
        [lon, lat, cartos[i].height !== undefined ? cartos[i].height - offset + GROUND_LIFT_M : alt]);
    }

    // Linear interpolation of the terrain profile at t seconds into the flight.
    function groundAt(profile, t) {
      if (!profile || !profile.t.length) return undefined;
      const ts = profile.t;
      if (t <= ts[0]) return profile.ground[0];
      if (t >= ts[ts.length - 1]) return profile.ground[ts.length - 1];
      let lo = 0, hi = ts.length - 1;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (ts[mid] <= t) lo = mid; else hi = mid; }
      const f = (t - ts[lo]) / (ts[hi] - ts[lo]);
      return profile.ground[lo] + (profile.ground[hi] - profile.ground[lo]) * f;
    }

    // Position the chart above the playbar, with its plot exactly over the
    // slider's travel. If the controls leave no room on the left (phone
    // portrait), the readouts stack above the plot instead.
    function layoutChart() {
      if (!chart.flight) return;
      const pb = document.getElementById('playbar').getBoundingClientRect();
      const track = document.getElementById('pb-track').getBoundingClientRect();
      const leftRoom = track.left - pb.left;
      const stacked = leftRoom < 300; // three readout columns need about this much
      const short = window.innerHeight <= 500;
      const height = stacked ? 146 : (short ? 70 : 90);
      Object.assign(chart.el.style, {
        left: `${pb.left}px`, width: `${pb.width}px`, height: `${height}px`,
        bottom: `${window.innerHeight - pb.top + 8}px`,
      });
      chart.el.classList.toggle('stacked', stacked);
      chart.el.classList.toggle('short', short && !stacked);
      document.body.style.setProperty('--chart-h', `${height + 8}px`);

      const plotLeft = track.left - pb.left + CHART_SLIDER_THUMB_INSET;
      const plotRight = track.right - pb.left - CHART_SLIDER_THUMB_INSET;
      const plotTop = stacked ? 72 : 8;
      const plot = { left: plotLeft, top: plotTop, w: Math.max(10, plotRight - plotLeft), h: height - plotTop - 8 };
      chart.plot = plot;
      for (const c of [chart.staticCanvas, chart.cursorCanvas]) {
        Object.assign(c.style, { left: `${plot.left}px`, top: `${plot.top}px`, width: `${plot.w}px`, height: `${plot.h}px` });
        c.width = Math.round(plot.w * devicePixelRatio);
        c.height = Math.round(plot.h * devicePixelRatio);
      }
      Object.assign(chart.readouts.style, stacked
        ? { left: '12px', right: '12px', top: '6px', bottom: 'auto', height: '60px' }
        : { left: '14px', right: `${pb.width - plotLeft + CHART_SLIDER_THUMB_INSET + 14}px`, top: '0', bottom: '0', height: 'auto' });
      chart.lastCursorX = null;
    }

    // Chart scales: x over the clock span (like the slider), y over the flight's altitudes and terrain.
    function chartScales() {
      const f = chart.flight, { w, h } = chart.plot;
      const span = clockSpanSeconds();
      const flightOffset = Cesium.JulianDate.secondsDifference(f.start, viewer.clock.startTime);
      const ground = f.terrainProfile ? f.terrainProfile.ground : [];
      let lo = Math.min(...f.alts, ...ground), hi = Math.max(...f.alts, ...ground);
      const pad = Math.max(20, (hi - lo) * 0.08);
      lo -= pad; hi += pad;
      return {
        x: (tFlight) => ((flightOffset + tFlight) / span) * w,
        y: (alt) => h - ((alt - lo) / (hi - lo)) * h,
        lo, hi,
      };
    }

    function drawChartStatic() {
      if (!chart.flight || !chart.plot) return;
      const f = chart.flight, { w, h } = chart.plot;
      const ctx = chart.staticCanvas.getContext('2d');
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const sc = chart.scales = chartScales();

      // Gridlines at a "nice" altitude step giving 2-4 lines.
      const range = sc.hi - sc.lo;
      const step = [50, 100, 200, 250, 500, 1000, 2000].find(s => range / s <= 4) ?? 5000;
      ctx.font = '10px system-ui, sans-serif';
      ctx.textBaseline = 'bottom';
      for (let v = Math.ceil(sc.lo / step) * step; v < sc.hi; v += step) {
        const y = Math.round(sc.y(v)) + 0.5;
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fillText(`${v} m`, 3, y - 1);
      }

      // Terrain: translucent filled area under a faint edge.
      const prof = f.terrainProfile;
      if (prof && prof.t.length > 1) {
        ctx.beginPath();
        ctx.moveTo(sc.x(prof.t[0]), h);
        prof.t.forEach((t, i) => ctx.lineTo(sc.x(t), sc.y(prof.ground[i])));
        ctx.lineTo(sc.x(prof.t[prof.t.length - 1]), h);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fill();
        ctx.beginPath();
        prof.t.forEach((t, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, sc.x(t), sc.y(prof.ground[i])));
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Altitude: decimated to roughly two points per pixel.
      const every = Math.max(1, Math.floor(f.times.length / (w * 2)));
      ctx.beginPath();
      for (let i = 0; i < f.times.length; i += every) {
        (i ? ctx.lineTo : ctx.moveTo).call(ctx, sc.x(f.times[i]), sc.y(f.alts[i]));
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.stroke();
      chart.lastCursorX = null;
    }

    function formatReadout(v, unit, signed = false) {
      if (v === undefined || !Number.isFinite(v)) return '–';
      const sign = signed && v >= 0 ? '+' : '';
      return `${sign}${unit === 'm/s' ? v.toFixed(1) : Math.round(v).toLocaleString()} ${unit}`;
    }

    // Elapsed seconds as h:mm:ss (m:ss under an hour).
    function formatDuration(seconds) {
      if (seconds === undefined || !Number.isFinite(seconds)) return '–';
      const t = Math.max(0, Math.floor(seconds));
      const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = String(t % 60).padStart(2, '0');
      return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
    }

    // Per frame: move the cursor line; refresh readouts ~10x a second.
    function updateChart(force = false) {
      if (!chart.flight || !chart.plot || !chart.scales) return;
      const f = chart.flight, { w, h } = chart.plot;
      const now = viewer.clock.currentTime;
      const span = clockSpanSeconds();
      const x = (Cesium.JulianDate.secondsDifference(now, viewer.clock.startTime) / span) * w;
      const alt = f.altitudeAt(now);

      if (force || chart.lastCursorX === null || Math.abs(x - chart.lastCursorX) >= 0.5) {
        chart.lastCursorX = x;
        const ctx = chart.cursorCanvas.getContext('2d');
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, h); ctx.stroke();
        if (alt !== undefined) {
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(x, chart.scales.y(alt), 3, 0, Math.PI * 2); ctx.fill();
        }
      }

      const ms = performance.now();
      if (!force && ms - chart.lastReadoutMs < CHART_READOUT_MS) return;
      chart.lastReadoutMs = ms;
      let agl, climb, speed, dist, tFlight;
      if (alt !== undefined) {
        tFlight = Cesium.JulianDate.secondsDifference(now, f.start);
        const ground = groundAt(f.terrainProfile, tFlight);
        if (f.onGround) agl = 0; // clamped to the terrain
        else if (ground !== undefined) agl = alt - ground;
        const alt0 = f.altitudeAt(Cesium.JulianDate.addSeconds(now, -VARIO_WINDOW_SECONDS, new Cesium.JulianDate()));
        climb = alt0 === undefined ? 0 : (alt - alt0) / VARIO_WINDOW_SECONDS;
        const p1 = f.sampled.getValue(now);
        const p0 = f.sampled.getValue(Cesium.JulianDate.addSeconds(now, -CHART_SPEED_WINDOW_S, new Cesium.JulianDate()));
        if (p0 && p1) {
          const geodesic = new Cesium.EllipsoidGeodesic(
            Cesium.Cartographic.fromCartesian(p0), Cesium.Cartographic.fromCartesian(p1));
          speed = (geodesic.surfaceDistance / CHART_SPEED_WINDOW_S) * 3.6;
        }
        if (p1) {
          f.takeoff ??= Cesium.Cartographic.fromCartesian(f.positions[0]);
          dist = new Cesium.EllipsoidGeodesic(f.takeoff, Cesium.Cartographic.fromCartesian(p1)).surfaceDistance / 1000;
        }
      }
      document.getElementById('fc-alt').textContent = formatReadout(alt, 'm');
      document.getElementById('fc-agl').textContent = formatReadout(agl, 'm');
      document.getElementById('fc-climb').textContent = formatReadout(climb, 'm/s', true);
      document.getElementById('fc-speed').textContent = formatReadout(speed, 'km/h');
      document.getElementById('fc-dist').textContent = dist === undefined ? '–' : `${dist.toFixed(1)} km`;
      document.getElementById('fc-time').textContent = formatDuration(tFlight);
    }

    window.addEventListener('resize', () => {
      if (chart.flight) { layoutChart(); drawChartStatic(); updateChart(true); }
    });

    // Playback bar: replaces Cesium's animation dial and timeline.
    const playbar = {
      el: document.getElementById('playbar'),
      play: document.getElementById('pb-play'),
      speed: document.getElementById('pb-speed'),
      time: document.getElementById('pb-time'),
      slider: document.getElementById('pb-slider'),
      coverage: document.getElementById('pb-coverage'),
      span: document.getElementById('pb-span'),
      scrubbing: false,
    };

    function formatClockTime(julian, withSeconds = true) {
      const g = Cesium.JulianDate.toGregorianDate(julian);
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(g.hour)}:${pad(g.minute)}` + (withSeconds ? `:${pad(g.second)}` : '');
    }

    function clockSpanSeconds() {
      return Cesium.JulianDate.secondsDifference(viewer.clock.stopTime, viewer.clock.startTime);
    }

    // Static parts: enabled state, slider range, span label and per-flight coverage strips.
    function renderPlaybar() {
      if (chart.flight) requestAnimationFrame(() => { layoutChart(); drawChartStatic(); });
      playbar.el.classList.toggle('disabled', !flights.length);
      playbar.el.querySelectorAll('button, select, input').forEach(c => { c.disabled = !flights.length; });
      playbar.coverage.replaceChildren();
      if (!flights.length) {
        playbar.span.textContent = '';
        playbar.time.textContent = '--:--:-- UTC';
        return;
      }
      const clock = viewer.clock;
      const span = clockSpanSeconds();
      playbar.slider.max = Math.max(1, Math.round(span));
      playbar.span.textContent = `${formatClockTime(clock.startTime, false)}–${formatClockTime(clock.stopTime, false)}`;
      flights.forEach((f, i) => {
        const from = Cesium.JulianDate.secondsDifference(f.start, clock.startTime) / span;
        const to = Cesium.JulianDate.secondsDifference(f.stop, clock.startTime) / span;
        const strip = document.createElement('div');
        Object.assign(strip.style, {
          left: `${from * 100}%`, width: `${(to - from) * 100}%`, top: `${i * 4}px`, background: f.cssColor,
        });
        strip.title = f.name;
        playbar.coverage.appendChild(strip);
      });
      playbar.coverage.style.height = `${flights.length * 4}px`;
      updatePlaybar();
    }

    // Dynamic parts, run every frame: slider position, time readout, play icon.
    function updatePlaybar() {
      if (!flights.length) return;
      const clock = viewer.clock;
      if (clock.shouldAnimate && Cesium.JulianDate.greaterThanOrEquals(clock.currentTime, clock.stopTime)) {
        clock.shouldAnimate = false;
      }
      const secs = Math.round(Cesium.JulianDate.secondsDifference(clock.currentTime, clock.startTime));
      if (!playbar.scrubbing && Number(playbar.slider.value) !== secs) playbar.slider.value = secs;
      const text = `${formatClockTime(clock.currentTime)} UTC`;
      if (playbar.time.textContent !== text) playbar.time.textContent = text;
      const icon = clock.shouldAnimate ? '❚❚' : '▶';
      if (playbar.play.textContent !== icon) playbar.play.textContent = icon;
    }

    function togglePlay() {
      if (!flights.length) return;
      const clock = viewer.clock;
      if (!clock.shouldAnimate && Cesium.JulianDate.greaterThanOrEquals(clock.currentTime, clock.stopTime)) {
        clock.currentTime = clock.startTime.clone();
      }
      clock.shouldAnimate = !clock.shouldAnimate;
      updatePlaybar();
    }

    playbar.play.addEventListener('click', togglePlay);
    playbar.speed.addEventListener('change', () => { viewer.clock.multiplier = Number(playbar.speed.value); });
    playbar.slider.addEventListener('pointerdown', () => { playbar.scrubbing = true; });
    window.addEventListener('pointerup', () => { playbar.scrubbing = false; });
    playbar.slider.addEventListener('input', () => {
      viewer.clock.currentTime = Cesium.JulianDate.addSeconds(
        viewer.clock.startTime, Number(playbar.slider.value), new Cesium.JulianDate());
      updatePlaybar();
    });
    document.getElementById('pb-fullscreen').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.code !== 'Space' || ['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(ev.target.tagName)) return;
      ev.preventDefault();
      togglePlay();
    });

    async function fetchFlight(promise, fallbackName) {
      const res = await promise;
      const body = await res.json();
      if (!res.ok) throw new Error(`${fallbackName ?? 'Flight'}: ${body.detail ?? res.statusText}`);
      return addFlight(body, fallbackName);
    }

    document.getElementById('show-tracks').addEventListener('change', (ev) => {
      showTracks = ev.target.checked;
      flights.forEach(f => { f.track.show = showTracks; });
    });

    document.getElementById('auto-camera').addEventListener('click', () => setAutoCamera(camCtl?.mode !== 'auto'));
    document.getElementById('place-labels').addEventListener('change', (ev) => {
      showPlaces = ev.target.checked;
      if (showPlaces) {
        lastPlaceUpdateMs = 0; // let the visibility controller re-show them
        requestPlaces();
      } else {
        cancelPlaceLoading();
        places.forEach(pl => applyPlaceOpacity(pl, 0));
      }
    });
    document.getElementById('depth-of-field').addEventListener('change', (ev) => { tiltShift.stage.enabled = ev.target.checked; });

    document.getElementById('show-trails').addEventListener('change', (ev) => {
      showTrails = ev.target.checked;
      flights.forEach(f => { f.pilot.path.show = showTrails; });
    });

    // Minimise / restore the main menu (remembered per browser where possible).
    function setPanelHidden(hidden) {
      document.getElementById('panel').classList.toggle('hidden', hidden);
      try { localStorage.setItem('panelHidden', hidden ? '1' : '0'); } catch { /* storage unavailable */ }
    }
    document.getElementById('panel-hide').addEventListener('click', () => setPanelHidden(true));
    document.getElementById('panel-show').addEventListener('click', () => setPanelHidden(false));
    // Start hidden if the user hid it last time, or on a phone-sized screen
    // (where the menu would cover most of the view) unless they chose to show it.
    {
      let saved = null;
      try { saved = localStorage.getItem('panelHidden'); } catch { /* storage unavailable */ }
      const smallScreen = window.matchMedia('(max-width: 640px), (max-height: 500px)').matches;
      if (saved === '1' || (saved === null && smallScreen)) document.getElementById('panel').classList.add('hidden');
    }

    document.getElementById('add-files').addEventListener('click', () => document.getElementById('upload').click());

    document.getElementById('upload').addEventListener('change', async (ev) => {
      const err = document.getElementById('error');
      err.textContent = '';
      const errors = [];
      const wasEmpty = !flights.length;
      for (const file of ev.target.files) {
        const form = new FormData();
        form.append('file', file);
        try {
          await fetchFlight(fetch('/api/flights/upload', { method: 'POST', body: form }), file.name);
        } catch (e) {
          errors.push(e.message);
        }
      }
      err.textContent = errors.join('\n');
      ev.target.value = '';
      // Auto camera already keeps pilots framed; only fly in for the first load.
      if (camCtl?.mode !== 'auto' || wasEmpty) flyToAll();
      requestPlaces();
    });

    (async () => {
      viewer = await createViewer();
      viewer.clock.multiplier = Number(playbar.speed.value);
      viewer.clock.onTick.addEventListener(updateAutoCamera);
      viewer.clock.onTick.addEventListener(updatePlaybar);
      viewer.clock.onTick.addEventListener(() => updateChart());
      tiltShift = createTiltShift();
      viewer.clock.onTick.addEventListener(updateTiltShift);
      placeLabels = viewer.scene.primitives.add(new Cesium.LabelCollection());
      placeLines = viewer.scene.primitives.add(new Cesium.PolylineCollection());
      placeLineMaterial = Cesium.Material.fromType('Color', { color: Cesium.Color.WHITE.withAlpha(0.5) });
      viewer.clock.onTick.addEventListener(updatePlaceVisibility);
      viewer.scene.postRender.addEventListener(updateFlags);
      setAutoCamera(true);
      renderList();
    })();
  </script>
</body>
